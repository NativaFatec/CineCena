<body class="login-body">
  <main class="login-page">
    <section class="login-visual">
      <a class="brand login-brand" href="index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-name">Cine<span>Cena</span></span></a>
      <div class="login-story"><h1>Assista.<br>Registre.<br><span>Converse.</span></h1><p>Um espaço para descobrir filmes nacionais, escrever reviews sem notas, montar listas e acompanhar o que sua rede está assistindo.</p><div class="login-points"></span></div></div>
    </section>
    <section class="login-panel">
      <div class="login-card"><h2>Entrar no CineCena</h2><br><form data-login-form><label>E-mail ou usuário<input type="text" required placeholder="@usuario ou email@exemplo.com" value="@usuario"></label><label>Senha<span class="label-row"></span><input type="password" required placeholder="Sua senha" value="123456"></label><button class="btn btn-primary login-submit" type="submit">Entrar no CineCena</button><button type="button" class="link-button" data-forgot>Esqueci a senha</button></form><div class="login-divider"><span>ou</span></div><button class="btn btn-secondary w-full" type="button" data-signup>Criar uma conta</button><div class="login-legal"><a href="pages/about.html">Sobre</a><a href="pages/terms.html">Termos e condições</a></div></div>
      <p class="prototype-note">Todos os direitos reservados © 2026 CineCena</p>
    </section>
  </main>
  <div id="portal"></div>
  <script src="assets/js/auth.js"></script>
