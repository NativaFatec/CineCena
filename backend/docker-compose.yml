services:
  db:
    image: postgres:16-alpine
    container_name: cinecena-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinecena
      POSTGRES_USER: cinecena
      POSTGRES_PASSWORD: cinecena_dev
    ports:
      - "5432:5432"
    volumes:
      - cinecena_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinecena -d cinecena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cinecena_postgres_data:
